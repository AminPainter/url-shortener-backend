_format_version: '3.0'

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      resource_attributes:
        service.name: kong
      propagation:
        default_format: w3c
        extract: [w3c]
        inject: [w3c]
  - name: cors
    config:
      origins: ['http://localhost:6175']
      methods: [GET, POST, OPTIONS]
      headers: [Authorization, Content-Type]
      exposed_headers: [Retry-After, RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset]
      credentials: false

services:
  - name: auth-service
    url: http://host.docker.internal:9119
    routes:
      - name: auth-health
        methods: [GET]
        paths: ['~/api/auth/health$']
        strip_path: false
      - name: signup
        methods: [POST, OPTIONS]
        paths: ['~/api/auth/signup$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 20
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1
      - name: login
        methods: [POST, OPTIONS]
        paths: ['~/api/auth/login$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 100
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1

  - name: short-url-write-service
    url: http://host.docker.internal:9112
    routes:
      - name: write-health
        methods: [GET]
        paths: ['~/api/health$']
        strip_path: false
      - name: create-short-url
        methods: [POST, OPTIONS]
        paths: ['~/api/short-urls$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 200
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1

      - name: list-short-urls
        methods: [GET]
        paths: ['~/api/short-urls$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1

      - name: list-plans
        methods: [GET]
        paths: ['~/api/plans$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1

      - name: get-subscription
        methods: [GET]
        paths: ['~/api/subscription$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1

  - name: short-url-read-service
    url: http://host.docker.internal:9111
    routes:
      - name: read-health
        methods: [GET]
        paths: ['~/health$']
        strip_path: false
      - name: redirect
        methods: [GET]
        paths: ['~/[0-9A-Za-z]{7}$']
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 50
              minute: 1000
              limit_by: ip
              policy: redis
              redis:
                host: redis
                port: 6379
                database: 1
