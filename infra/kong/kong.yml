_format_version: '3.0'

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      resource_attributes:
        service.name: kong
      propagation:
        default_format: w3c
        extract: [w3c]
        inject: [w3c]

services:
  - name: write-service
    url: http://host.docker.internal:9112
    routes:
      - name: write-health
        methods: [GET]
        paths: ['~/api/health$']
        strip_path: false
      - name: create-short-url
        methods: [POST]
        paths: ['~/api/short-urls$']
        strip_path: false

  - name: read-service
    url: http://host.docker.internal:9111
    routes:
      - name: read-health
        methods: [GET]
        paths: ['~/health$']
        strip_path: false
      - name: redirect
        methods: [GET]
        paths: ['~/[0-9A-Za-z]{7}$']
        strip_path: false
